# REPLICATION of the 2026-09-16 mug run (outputs/2026-09-16_08-48-19), which scored 3/10 success.
#
# Purpose: the 2026-09-17 six-object run produced 10 grasps and ZERO placements. Lift-timing analysis
# ruled out the shortened episode cap as the cause. So either those objects cannot satisfy
# object_on_destination in this bowl, or the original 3/10 was a lucky run.
#
# This changes NOTHING from the original config. Same object, same bowl, same hdr, same 70 s episode
# length, same 10 episodes. Do not "improve" it -- the point is an exact repeat.
#
#   3/10-ish  -> yesterday was real; the other five objects genuinely cannot be placed in this bowl
#   0/10      -> yesterday's successes were luck; true success rate is near zero
runs:
  mug_replication:
    environment:
      type: pick_and_place_maple_table
      enable_cameras: true
      embodiment: droid_abs_joint_pos
      pick_up_object: mug_ycb_robolab
      destination_location: bowl_ycb_robolab
      hdr: home_office_robolab
      # episode_length_s deliberately omitted -> uses the 70 s default, as on 2026-09-16
    environment_builder:
      language_instruction: Pick up the mug and place it in the bowl.
    policy:
      type: isaaclab_arena_gr00t.policy.gr00t_remote_closedloop_policy.Gr00tRemoteClosedloopPolicy
      policy_config_yaml_path: isaaclab_arena_gr00t/policy/config/droid_manip_gr00t_closedloop_config.yaml
      policy_device: cuda:0
      remote_host: 127.0.0.1
      remote_port: 5555
    rollout_limit:
      num_episodes: 10
